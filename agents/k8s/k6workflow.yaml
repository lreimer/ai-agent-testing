kind: TestWorkflow
apiVersion: testworkflows.testkube.io/v1
metadata:
  name: ephemeral-test
  namespace: testkube
spec:
  content:
    git:
      uri: https://github.com/cerebro1/testkube-ephemeral
      revision: main
      paths:
        - k6/testkube.js
  container:
    workingDir: /data/repo/k6/
    image: grafana/k6:0.49.0
  steps:
    - name: Run test
      shell: |
        k6 run testkube.js